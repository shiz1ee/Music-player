<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Music Player</title>
  </head>
  <body>
    <h1>Music Player</h1>

    <div class="music-container" id="music-container">
      <div class="music-info">
        <h4 id="title">gitar</h4>
        <div class="progress-container" id="progress-container">
          <div class="progress" id="progress"></div>
        </div>
      </div>

      <audio src="music/ukulele.mp3" id="audio"></audio>

      <div class="img-container">
        <img src="images/ukulele.jpg" alt="music-cover" id="cover" />
      </div>
      <div class="navigation">
        <button id="prev" class="action-btn">
          <i class="fas fa-backward"></i>
        </button>
        <button id="play" class="action-btn action-btn-big">
          <i class="fas fa-play"></i>
        </button>
        <button id="next" class="action-btn">
          <i class="fas fa-forward"></i>
        </button>
      </div>
      <div class="volume-container">
        <i class="fas fa-volume-down"></i>
        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
          >
          <i class="fas fa-volume-up"></i>
      </div>
    </div>
    <div class="queue-container">
      <h2>Queue</h2>

      <ul id="queue"></ul>
    </div>

    <div class="playlist-section">
      <div class="playlist-header">
        <h3 id="current-playlist-name">My playlist</h3>

        <div class="playlist-controls">
          <button id="playlist-play" class="playlist-btn">
            <i class="fas fa-play"></i>
          </button>

          <button id="playlist-shuffle" class="playlist-btn">
            <i class="fas fa-random"></i>
          </button>

          <button id="playlist-repeat" class="playlist-btn">
            <i class="fas fa-redo"></i>
          </button>
        </div>
      </div>

      <button id="add-playlist">
        <i class="fas fa-folder-plus"></i>
        Add Playlist
      </button>

      <div id="playlists"></div>

      <input
        type="file"
        id="folder-input"
        webkitdirectory
        directory
        multiple
        hidden
      />
    </div>

    <script src="script.js"></script>
  </body>
</html>
